services:
  shelfmark:
    image: ghcr.io/calibrain/shelfmark:latest
    container_name: shelfmark
    restart: unless-stopped
    env_file: .env
    environment:
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
    # Le bypasser DDoS-Guard/Cloudflare intégré lance un Chromium headless.
    # Avec les 64 Mo par défaut de /dev/shm sous Docker, le navigateur ne
    # démarre pas ("Pure CDP browser startup failed") — pas documenté par le
    # projet upstream, trouvé en déploiement réel. 2gb règle le problème.
    shm_size: "2gb"
    volumes:
      - ./data/books:/books
      - ./data/config:/config
    ports:
      - "${SHELFMARK_PORT:-8084}:8084"
