---
# Déploie la stack Shelfmark (docker-compose.yml à la racine du repo) sur la
# machine cible via Docker Compose. Par défaut cible localhost (déploiement
# local) — passer -i "mon-hote," -e ansible_user=... pour cibler une autre
# machine (nécessite Docker déjà installé sur la cible, ce playbook ne
# l'installe pas volontairement, portable vers n'importe quelle distro/hôte).
#
# Usage :
#   cd ansible && ansible-galaxy collection install -r requirements.yml
#   cp ../.env.example ../.env && $EDITOR ../.env
#   ansible-playbook deploy-shelfmark.yml
#
# Pour arrêter/supprimer la stack :
#   ansible-playbook deploy-shelfmark.yml -e shelfmark_state=absent

- name: Déployer Shelfmark localement via Docker Compose
  hosts: "{{ target | default('localhost') }}"
  connection: "{{ 'local' if (target | default('localhost')) == 'localhost' else 'ssh' }}"
  gather_facts: false

  vars:
    shelfmark_repo_dir: "{{ playbook_dir }}/.."
    shelfmark_state: present

  tasks:
    - name: Vérifier que Docker est disponible sur la cible
      ansible.builtin.command: docker info
      register: docker_info
      changed_when: false
      failed_when: docker_info.rc != 0

    - name: Créer les répertoires de données (books, config)
      ansible.builtin.file:
        path: "{{ shelfmark_repo_dir }}/data/{{ item }}"
        state: directory
        mode: "0755"
      loop:
        - books
        - config
      when: shelfmark_state == 'present'

    - name: Vérifier la présence de .env
      ansible.builtin.stat:
        path: "{{ shelfmark_repo_dir }}/.env"
      register: dotenv
      when: shelfmark_state == 'present'

    - name: Échouer si .env est absent (pas de valeurs par défaut à deviner)
      ansible.builtin.fail:
        msg: >-
          {{ shelfmark_repo_dir }}/.env introuvable — copie .env.example vers
          .env et renseigne au moins AA_MIRROR_URLS avant de lancer ce
          playbook (voir README.md).
      when:
        - shelfmark_state == 'present'
        - not dotenv.stat.exists

    - name: (Dé)Déployer la stack Shelfmark
      community.docker.docker_compose_v2:
        project_src: "{{ shelfmark_repo_dir }}"
        state: "{{ shelfmark_state }}"
        pull: "{{ 'always' if shelfmark_state == 'present' else omit }}"
      register: shelfmark_stack

    - name: Afficher l'état des conteneurs
      ansible.builtin.debug:
        var: shelfmark_stack.containers
      when: shelfmark_state == 'present'
